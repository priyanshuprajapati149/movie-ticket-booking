# Server Port
server.port=8080

# PostgreSQL Database Configuration (Neon Cloud)
# TODO: PASTE YOUR NEON JDBC URL HERE:
spring.datasource.url=jdbc:postgresql://ep-your-host-here.us-east-2.aws.neon.tech/neondb?user=neondb_owner&password=YOUR_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SQL Script Execution for initial data
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql
spring.jpa.defer-datasource-initialization=true


