<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookMyShow Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .movie-card:hover {
            transform: scale(1.02);
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm py-4 px-8 flex justify-between items-center border-b">
        <div class="flex items-center space-x-8">
            <h1 class="text-2xl font-bold text-red-500 tracking-tight">book<span class="text-gray-800">my</span>show</h1>
            <div class="relative hidden md:block">
                <input type="text" placeholder="Search for Movies, Events, Plays..." class="w-96 pl-10 pr-4 py-2 border rounded-md focus:outline-none focus:ring-1 focus:ring-red-500 text-sm">
                <svg class="w-5 h-5 text-gray-400 absolute left-3 top-2.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm text-gray-600 hidden md:block">Location</span>
            <button class="bg-red-500 text-white px-4 py-1.5 rounded text-sm font-medium hover:bg-red-600">Sign in</button>
        </div>
    </nav>

    <!-- Sub Navigation -->
    <div class="bg-gray-100 py-2 px-8 text-sm text-gray-600 flex space-x-6 border-b">
        <a href="#" class="hover:text-red-500">Movies</a>
        <a href="#" class="hover:text-red-500">Stream</a>
        <a href="#" class="hover:text-red-500">Events</a>
        <a href="#" class="hover:text-red-500">Plays</a>
        <a href="#" class="hover:text-red-500">Sports</a>
    </div>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-8 py-8">
        
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Recommended Movies</h2>
        
        <!-- Movie Grid -->
        <div id="movie-grid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-6">
            <!-- Movies will be dynamically injected here by JavaScript -->
            <div class="animate-pulse flex space-x-4">
              <div class="rounded-lg bg-gray-300 h-64 w-full"></div>
            </div>
        </div>

    </main>

    <script>
        // Fetch movies from our Spring Boot API
        fetch('/api/browse/movies')
            .then(response => response.json())
            .then(movies => {
                const grid = document.getElementById('movie-grid');
                grid.innerHTML = ''; // Clear loading skeleton

                movies.forEach(movie => {
                    // Generate a generic image placeholder since we don't have posters in the DB
                    const posterUrl = `https://placehold.co/400x600/333/FFF?text=${encodeURIComponent(movie.title)}`;
                    
                    const card = `
                        <div class="movie-card cursor-pointer group">
                            <div class="relative overflow-hidden rounded-lg mb-3">
                                <img src="${posterUrl}" alt="${movie.title}" class="w-full h-auto object-cover rounded-lg">
                                <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-75 text-white text-xs px-2 py-1 flex items-center justify-between">
                                    <span>⭐ 8.5/10</span>
                                    <span>50K Votes</span>
                                </div>
                            </div>
                            <h3 class="font-semibold text-gray-800 text-lg truncate">${movie.title}</h3>
                            <p class="text-gray-500 text-sm">${movie.genre} • ${movie.language}</p>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            })
            .catch(error => {
                console.error('Error fetching movies:', error);
                document.getElementById('movie-grid').innerHTML = '<p class="text-red-500 col-span-full">Failed to load movies. Ensure the backend is running!</p>';
            });
    </script>
</body>
</html>
